# Project-scoped Codex config; loaded only while this project is trusted.
# agentbus lets Codex coordinate with other agents (see scripts/agentbus/README.md).
# The launcher finds the checkout from the session directory, so linked
# worktrees run their own copy of the server against the shared database.
[mcp_servers.agentbus]
command = "powershell"
args = ["-NoProfile", "-Command", "$env:RUSTFLAGS = ' '; $root = (git rev-parse --show-toplevel).Trim(); cargo run --quiet --manifest-path (Join-Path $root 'scripts/agentbus/Cargo.toml') -- serve"]
env = { AGENTBUS_AGENT = "codex" }
