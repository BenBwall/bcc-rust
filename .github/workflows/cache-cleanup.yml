name: Cache cleanup

# A pull request's caches are readable only from that pull request, so once it
# closes they only take space from main's. pull_request_target grants the write
# token for forks too; this job never checks out or runs pull request code.
on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete the pull request's caches
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          gh cache list --ref "$REF" --limit 100 --json id --jq '.[].id' |
            while read -r id; do gh cache delete "$id"; done
