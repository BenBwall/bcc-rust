name: Pages

# Lints, tests and builds the static site in web/ and publishes web/dist/ to
# GitHub Pages. Pull requests only lint, test and build it; pushes to main and
# manual runs also deploy. The paths are everything the site build reads: web/ itself
# (including the Monaco bundle in web/editor and the precomputed LLVM IR in
# web/pipeline) and the root crate, whose abstract machine and pure-Rust
# compiler (the `explorer` feature, without LLVM) the site's Workers link.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "build.rs"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/**"
      - "build.rs"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The Trunk release web/README.md records the site being verified with.
  TRUNK_VERSION: 0.22.0
  TRUNK_SHA256: f78c1989240c56592d8cfc4df5cc27399a3ff66a3f9cc819e16f1e3d809ce7c2

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      # web/ has no toolchain file of its own, so rustup resolves the
      # repository's pinned toolchain from the root.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> target
      # The Monaco editor bundle and the web fonts come from npm, pinned by
      # web/editor/package-lock.json, and are bundled into the site; nothing
      # is fetched from a CDN at run time.
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/editor/package-lock.json
      - name: Install Trunk
        working-directory: ${{ runner.temp }}
        run: |
          archive=trunk-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfLO "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/$archive"
          echo "$TRUNK_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$HOME/.cargo/bin"
      # The engine's own tests, and the site's (which run the engine, the
      # in-browser compiler and the WebAssembly stepper over every lesson and
      # check the precomputed LLVM IR and WebAssembly match the lessons).
      # RUSTFLAGS= keeps the repository's LLVM linker flags
      # (.cargo/config.toml) away from these host builds, as for prerender.
      - name: Test the abstract machine
        working-directory: .
        run: RUSTFLAGS= cargo test --lib --no-default-features --features abstract-machine abstract_machine
      - name: Test the site
        run: RUSTFLAGS= cargo test --features ssr,worker,compiler
      # The WebAssembly interpreter behind the site's WebAssembly view, with
      # the lesson modules clang built (web/wasm).
      - name: Test the WebAssembly stepper
        run: RUSTFLAGS= cargo test -p bcc-wasm-stepper
      # build.sh bundles the editor (npm ci, then esbuild), then runs Trunk,
      # which downloads the wasm-bindgen and wasm-opt versions it needs.
      - name: Build
        run: sh build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  # The site's lints (clippy's pedantic group, web/Cargo.toml) for the native
  # build and each of the three wasm32 builds Trunk makes, beside the build
  # job rather than in it, so they add nothing to its time.
  lint:
    name: Lint site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> target
          key: clippy
      - name: Clippy (native)
        run: RUSTFLAGS= cargo clippy --workspace --all-targets --features ssr,worker,compiler -- -D warnings
      - name: Clippy (wasm32)
        run: |
          for feature in hydrate worker compiler; do
            cargo clippy --target wasm32-unknown-unknown --features "$feature" -- -D warnings
          done

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
