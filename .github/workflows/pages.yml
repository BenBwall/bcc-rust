name: Pages

# Builds the static site in web/ and publishes web/dist/ to GitHub Pages.
# Pull requests only build it; pushes to main and manual runs also deploy.
# The paths are everything the site build reads: web/ itself and the
# abstract-machine engine it links from the root crate.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/lib.rs"
      - "src/abstract_machine.rs"
      - "src/abstract_machine/**"
      - "build.rs"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/lib.rs"
      - "src/abstract_machine.rs"
      - "src/abstract_machine/**"
      - "build.rs"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The Trunk release web/README.md records the site being verified with.
  TRUNK_VERSION: 0.22.0
  TRUNK_SHA256: f78c1989240c56592d8cfc4df5cc27399a3ff66a3f9cc819e16f1e3d809ce7c2

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      # web/ has no toolchain file of its own, so rustup resolves the
      # repository's pinned toolchain from the root.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> target
      - name: Install Trunk
        working-directory: ${{ runner.temp }}
        run: |
          archive=trunk-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfLO "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/$archive"
          echo "$TRUNK_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$HOME/.cargo/bin"
      # Trunk downloads the wasm-bindgen and wasm-opt versions it needs.
      # web/build.sh only runs from the agent worktree, so call Trunk directly.
      - name: Build
        run: |
          trunk build --release
          rm -f dist/.trunk-lock
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
