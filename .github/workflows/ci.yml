name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  agentbus:
    name: Agentbus
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: ""
      CARGO_ENCODED_RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: python -m unittest discover -s scripts/agentbus/tests -p 'test_*.py'
      - run: python -m unittest discover -s scripts -p 'test_codegraph_mcp.py'
      - run: cargo test --manifest-path scripts/agentbus/Cargo.toml

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: cargo +nightly fmt --check

  # The explorer's pure-Rust compiler for the website: no LLVM, C toolchain
  # or build script work, so this job needs only rustup's wasm32 target.
  wasm-explorer:
    name: WebAssembly explorer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-explorer
      - run: cargo build --lib --target wasm32-unknown-unknown --no-default-features --features explorer
      - run: cargo clippy --lib --target wasm32-unknown-unknown --no-default-features --features explorer,serde -- -D warnings
      - run: cargo clippy --lib --no-default-features --features explorer -- -D warnings
      - name: Smoke test in Node
        working-directory: scripts/wasm_explorer_smoke
        run: |
          cargo build --release --target wasm32-unknown-unknown
          node run.mjs target/wasm32-unknown-unknown/release/wasm_explorer_smoke.wasm

  llvm:
    name: Pinned LLVM toolchain
    runs-on: ubuntu-24.04
    # A cold build compiles Clang, libclang, and LLD from source.
    timeout-minutes: 300
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v5
      # The installation depends only on the pinned Rust revision (which pins
      # LLVM), the CMake configuration in build_support/llvm/tools.rs, and
      # the toolchain, whose LLVM version the installation stamp records.
      - name: Compute cache key
        id: key
        run: |
          rust=$(git rev-parse HEAD:vendor/rust)
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "key=llvm-${{ runner.os }}-$rust-${{ hashFiles('build_support/llvm/tools.rs', 'rust-toolchain.toml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore LLVM installation
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            target/llvm
            !target/llvm/build
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Install LLVM build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Fetch pinned Rust and LLVM sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sparse_fetch() {
            git init -q "$1"
            git -C "$1" remote add origin "$2"
            git -C "$1" config remote.origin.promisor true
            git -C "$1" config remote.origin.partialclonefilter blob:none
            git -C "$1" config core.sparseCheckout true
            git -C "$1" config core.sparseCheckoutCone false
            cp "$3" "$1/.git/info/sparse-checkout"
            git -C "$1" fetch -q --depth 1 --filter=blob:none origin "$4"
            git -C "$1" checkout -q --detach "$4"
          }
          sparse_fetch vendor/rust https://github.com/rust-lang/rust.git \
            build_support/rust.sparse "${{ steps.key.outputs.rust }}"
          llvm=$(git -C vendor/rust rev-parse HEAD:src/llvm-project)
          sparse_fetch vendor/rust/src/llvm-project https://github.com/rust-lang/llvm-project.git \
            build_support/llvm.sparse "$llvm"
      - name: Install Rust toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: rustup toolchain install
      - name: Build LLVM through the build script
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo check --lib
      - name: Save LLVM installation
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/llvm
            !target/llvm/build
          key: ${{ steps.key.outputs.key }}

  clippy:
    name: Clippy
    needs: llvm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          llvm-key: ${{ needs.llvm.outputs.key }}
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features benchmarking-internals -- -D warnings

  test:
    name: Tests
    needs: llvm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          llvm-key: ${{ needs.llvm.outputs.key }}
      - run: cargo test --all-targets --no-fail-fast
      - run: cargo test --features benchmarking-internals --test allocation_count
      # The site (web/) compiles every stage live in the browser except LLVM
      # IR, which it carries precomputed by the native compiler for each
      # lesson. Regenerate it with this commit's compiler and fail if it
      # differs, so a compiler change cannot leave the site's LLVM IR stale.
      - name: Check the site's precomputed LLVM IR
        if: ${{ !cancelled() }}
        run: |
          cargo build --bin bcc-rust
          host=$(rustc -vV | sed -n 's/^host: //p')
          BCC="target/$host/debug/bcc-rust" sh web/pipeline/generate.sh --check

  # The same pinned LLVM for Windows GNU, the host of the Windows tests: the
  # build script bootstraps Clang, libclang and LLD with the image's MSVC
  # (target/llvm), then builds LLVM's static libraries with that Clang for
  # MinGW-w64 (target/llvm-libs). Each installation has its own cache, so a
  # cold run that times out after the tools keeps them for the next run.
  llvm-windows:
    name: Pinned LLVM toolchain (Windows)
    runs-on: windows-latest
    timeout-minutes: 350
    outputs:
      tools: ${{ steps.key.outputs.tools }}
      libraries: ${{ steps.key.outputs.libraries }}
    steps:
      - uses: actions/checkout@v5
      - name: Compute cache keys
        id: key
        shell: bash
        run: |
          rust=$(git rev-parse HEAD:vendor/rust)
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "tools=llvm-windows-gnu-tools-$rust-${{ hashFiles('build_support/llvm/tools.rs', 'rust-toolchain.toml') }}" >> "$GITHUB_OUTPUT"
          echo "libraries=llvm-windows-gnu-libraries-$rust-${{ hashFiles('build_support/llvm.rs', 'build_support/llvm/tools.rs', 'rust-toolchain.toml', '.github/actions/setup-windows/action.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Look up the LLVM tools
        id: tools-lookup
        uses: actions/cache/restore@v4
        with:
          path: |
            target/llvm
            !target/llvm/build
          key: ${{ steps.key.outputs.tools }}
          lookup-only: true
      - name: Look up the LLVM libraries
        id: libraries-lookup
        uses: actions/cache/restore@v4
        with:
          path: |
            target/llvm-libs
            !target/llvm-libs/build
          key: ${{ steps.key.outputs.libraries }}
          lookup-only: true
      - name: Decide whether to build
        id: need
        shell: bash
        run: |
          if [ "${{ steps.tools-lookup.outputs.cache-hit }}" = true ] && [ "${{ steps.libraries-lookup.outputs.cache-hit }}" = true ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the LLVM tools
        if: steps.need.outputs.build == 'true' && steps.tools-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            target/llvm
            !target/llvm/build
          key: ${{ steps.key.outputs.tools }}
      - uses: ./.github/actions/setup-windows
        if: steps.need.outputs.build == 'true'
      - name: Install Ninja
        if: steps.need.outputs.build == 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
      - name: Fetch pinned Rust and LLVM sources
        if: steps.need.outputs.build == 'true'
        shell: bash
        run: |
          git config --global core.longpaths true
          sparse_fetch() {
            git init -q "$1"
            git -C "$1" remote add origin "$2"
            git -C "$1" config remote.origin.promisor true
            git -C "$1" config remote.origin.partialclonefilter blob:none
            git -C "$1" config core.sparseCheckout true
            git -C "$1" config core.sparseCheckoutCone false
            cp "$3" "$1/.git/info/sparse-checkout"
            git -C "$1" fetch -q --depth 1 --filter=blob:none origin "$4"
            git -C "$1" checkout -q --detach "$4"
          }
          sparse_fetch vendor/rust https://github.com/rust-lang/rust.git \
            build_support/rust.sparse "${{ steps.key.outputs.rust }}"
          llvm=$(git -C vendor/rust rev-parse HEAD:src/llvm-project)
          sparse_fetch vendor/rust/src/llvm-project https://github.com/rust-lang/llvm-project.git \
            build_support/llvm.sparse "$llvm"
      - name: Build LLVM through the build script
        if: steps.need.outputs.build == 'true'
        run: cargo check --lib
      - name: Save the LLVM tools
        if: always() && steps.need.outputs.build == 'true' && steps.tools-lookup.outputs.cache-hit != 'true' && hashFiles('target/llvm/.installed-version') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            target/llvm
            !target/llvm/build
          key: ${{ steps.key.outputs.tools }}
      - name: Save the LLVM libraries
        if: steps.need.outputs.build == 'true' && steps.libraries-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/llvm-libs
            !target/llvm-libs/build
          key: ${{ steps.key.outputs.libraries }}

  # The test suite on a Windows GNU host with MinGW-w64, as on a developer's
  # Windows machine, and with the image's Visual Studio Build Tools and
  # Windows SDK, which the cl.exe comparisons in tests/integration/msvc use.
  # The image has no WSL distribution, so the Linux runs under WSL skip.
  test-windows:
    name: Tests (Windows)
    needs: llvm-windows
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      # The golden and snapshot fixtures are compared byte for byte with
      # bcc's LF output, so the checkout keeps LF, as on a developer's host.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - name: Restore the LLVM tools
        uses: actions/cache/restore@v4
        with:
          path: |
            target/llvm
            !target/llvm/build
          key: ${{ needs.llvm-windows.outputs.tools }}
          fail-on-cache-miss: true
      - name: Restore the LLVM libraries
        uses: actions/cache/restore@v4
        with:
          path: |
            target/llvm-libs
            !target/llvm-libs/build
          key: ${{ needs.llvm-windows.outputs.libraries }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/setup-windows
      - run: cargo test --all-targets --no-fail-fast
      # Which Visual Studio installation the cl.exe comparisons used, if any;
      # without one they skip.
      - name: Report the Microsoft toolchain
        if: ${{ !cancelled() }}
        run: cargo test --test integration msvc::toolchain::probe -- --ignored --nocapture

  bench:
    name: Benchmarks
    needs: llvm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          llvm-key: ${{ needs.llvm.outputs.key }}
      - run: cargo bench --features benchmarking-internals --bench bench -- --noplot
      - name: Upload Criterion results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion
          path: target/criterion
          if-no-files-found: ignore
