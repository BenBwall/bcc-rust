name: Windows runner
run-name: Windows ${{ inputs.suite }} · ${{ inputs.commit_sha }} · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Trusted full commit SHA already pushed to this repository
        required: true
        type: string
      suite:
        description: Windows workload
        required: true
        default: ci
        type: choice
        options: [ci, test, bench]
      cargo_args_json:
        description: JSON argument array appended to cargo test or cargo bench
        required: false
        default: '[]'
        type: string
      request_id:
        description: Optional unique submission identifier
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bcc-win-x64
  cancel-in-progress: false

jobs:
  windows:
    runs-on: [self-hosted, Windows, X64, bcc-windows]
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: 1.99.0-x86_64-pc-windows-gnu
      MINGW_ROOT: C:\Strawberry\c
      CARGO_BUILD_JOBS: 8
      CARGO_TERM_COLOR: never
    steps:
      - name: Validate request
        env:
          EXACT_SHA: ${{ inputs.commit_sha }}
          CARGO_ARGS_JSON: ${{ inputs.cargo_args_json }}
        run: |
          if ($env:EXACT_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'A full lowercase commit SHA is required.' }
          $arguments = ConvertFrom-Json -InputObject $env:CARGO_ARGS_JSON -NoEnumerate
          if ($arguments -isnot [array] -or @($arguments | Where-Object { $_ -isnot [string] }).Count) {
            throw 'cargo_args_json must be a JSON array of strings.'
          }
          $evidence = Join-Path $env:RUNNER_TEMP "bcc-windows-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $evidence | Out-Null
          "BCC_EVIDENCE=$evidence" >> $env:GITHUB_ENV

      - name: Check out dispatcher helpers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: runner-kit
          persist-credentials: false
          submodules: false

      - name: Check out requested compiler commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.commit_sha }}
          path: source
          clean: false
          persist-credentials: false
          submodules: false

      - name: Prepare native Windows toolchain and exact source pins
        run: |
          & "$env:GITHUB_WORKSPACE/runner-kit/.github/scripts/windows/Initialize-Windows.ps1" `
            -Repository "$env:GITHUB_WORKSPACE/source"
          & "$env:GITHUB_WORKSPACE/runner-kit/.github/scripts/windows/prepare-sources.ps1" `
            -Repository "$env:GITHUB_WORKSPACE/source" 2>&1 |
            Tee-Object -FilePath "$env:BCC_EVIDENCE/source-setup.log"

      - name: Run requested Windows workload
        env:
          EXACT_SHA: ${{ inputs.commit_sha }}
          SUITE: ${{ inputs.suite }}
          CARGO_ARGS_JSON: ${{ inputs.cargo_args_json }}
        run: |
          & "$env:GITHUB_WORKSPACE/runner-kit/.github/scripts/windows/Invoke-Windows.ps1" `
            -Repository "$env:GITHUB_WORKSPACE/source" -ExpectedSha $env:EXACT_SHA `
            -Suite $env:SUITE -CargoArgumentsJson $env:CARGO_ARGS_JSON -ResultsDirectory $env:BCC_EVIDENCE
          exit $LASTEXITCODE

      - name: Upload results and benchmark reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ inputs.suite }}-${{ inputs.commit_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BCC_EVIDENCE }}
            ${{ github.workspace }}/source/target/criterion
            ${{ github.workspace }}/source/target/x86_64-pc-windows-gnu/criterion
          if-no-files-found: warn
          retention-days: 14
