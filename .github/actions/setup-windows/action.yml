name: Set up Rust and MinGW-w64 on Windows
description: >-
  Install the pinned Rust toolchain for x86_64-pc-windows-gnu and the pinned
  MinGW-w64 installation (Strawberry Perl 5.40.0.1's GCC 13.2.0 UCRT build),
  and export RUSTUP_TOOLCHAIN, MINGW_ROOT and PATH for later steps. MinGW's
  bin directory comes after the image's tools on PATH.

runs:
  using: composite
  steps:
    # Strawberry's archive is 300 MB; downloading it each run keeps the
    # cache for LLVM, which takes the longest to rebuild.
    - name: Install MinGW-w64
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $zip = Join-Path $env:RUNNER_TEMP 'strawberry.zip'
        Invoke-WebRequest -Uri 'https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54001_64bit_UCRT/strawberry-perl-5.40.0.1-64bit-portable.zip' -OutFile $zip
        $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash
        if ($hash -ne '754F3E2A8E473DC68D1540C7802FB166A025F35EF18960C4564A31F8B5933907') {
          throw "Unexpected Strawberry Perl archive: $hash"
        }
        Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TOOL_CACHE/strawberry-5.40.0.1"
    - name: Select the toolchains
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $mingw = "$env:RUNNER_TOOL_CACHE\strawberry-5.40.0.1\c"
        "MINGW_ROOT=$mingw" >> $env:GITHUB_ENV
        # After the image's tools: Strawberry's bin also holds a CMake and a
        # Ninja, which must not replace the image's.
        "PATH=$env:PATH;$mingw\bin" >> $env:GITHUB_ENV
        "RUSTUP_TOOLCHAIN=1.99.0-x86_64-pc-windows-gnu" >> $env:GITHUB_ENV
        rustup toolchain install 1.99.0-x86_64-pc-windows-gnu --profile minimal --component clippy,llvm-tools
        if ($LASTEXITCODE -ne 0) { throw 'rustup failed' }
    - name: Show the toolchains
      shell: pwsh
      run: |
        rustc -vV
        gcc --version
        Get-Command gcc, cmake, ninja, python -ErrorAction Continue | Format-Table -AutoSize Name, Source
