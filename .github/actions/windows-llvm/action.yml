name: Set up Windows GNU and the pinned LLVM
description: >-
  Set up Rust and MinGW-w64 on Windows and restore the two cached Windows GNU
  LLVM installations. When either is missing, fetch the pinned sources so the
  build script can build it. The caller checks out with LF line endings first
  and saves the installations.

outputs:
  tools-key:
    description: Cache key of the LLVM tools (target/llvm).
    value: ${{ steps.key.outputs.tools }}
  tools-hit:
    description: Whether the LLVM tools were restored.
    value: ${{ steps.tools.outputs.cache-hit }}
  libraries-key:
    description: Cache key of the LLVM libraries (target/llvm-libs).
    value: ${{ steps.key.outputs.libraries }}
  libraries-hit:
    description: Whether the LLVM libraries were restored.
    value: ${{ steps.libraries.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Compute cache keys
      id: key
      shell: bash
      run: |
        rust=$(git rev-parse HEAD:vendor/rust)
        echo "rust=$rust" >> "$GITHUB_OUTPUT"
        echo "tools=llvm-windows-gnu-tools-$rust-${{ hashFiles('build_support/llvm/tools.rs', 'rust-toolchain.toml') }}" >> "$GITHUB_OUTPUT"
        echo "libraries=llvm-windows-gnu-libraries-$rust-${{ hashFiles('build_support/llvm.rs', 'build_support/llvm/tools.rs', 'rust-toolchain.toml', '.github/actions/setup-windows/action.yml') }}" >> "$GITHUB_OUTPUT"
    - name: Restore the LLVM tools
      id: tools
      uses: actions/cache/restore@v4
      with:
        path: |
          target/llvm
          !target/llvm/build
        key: ${{ steps.key.outputs.tools }}
    - name: Restore the LLVM libraries
      id: libraries
      uses: actions/cache/restore@v4
      with:
        path: |
          target/llvm-libs
          !target/llvm-libs/build
        key: ${{ steps.key.outputs.libraries }}
    - uses: ./.github/actions/setup-windows
    - name: Fetch pinned Rust and LLVM sources
      if: steps.tools.outputs.cache-hit != 'true' || steps.libraries.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git config --global core.longpaths true
        sparse_fetch() {
          git init -q "$1"
          git -C "$1" remote add origin "$2"
          git -C "$1" config remote.origin.promisor true
          git -C "$1" config remote.origin.partialclonefilter blob:none
          git -C "$1" config core.sparseCheckout true
          git -C "$1" config core.sparseCheckoutCone false
          cp "$3" "$1/.git/info/sparse-checkout"
          git -C "$1" fetch -q --depth 1 --filter=blob:none origin "$4"
          git -C "$1" checkout -q --detach "$4"
        }
        sparse_fetch vendor/rust https://github.com/rust-lang/rust.git \
          build_support/rust.sparse "${{ steps.key.outputs.rust }}"
        llvm=$(git -C vendor/rust rev-parse HEAD:src/llvm-project)
        sparse_fetch vendor/rust/src/llvm-project https://github.com/rust-lang/llvm-project.git \
          build_support/llvm.sparse "$llvm"
