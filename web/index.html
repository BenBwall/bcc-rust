<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="An interactive introduction to how C runs: step through programs on the C abstract machine, then watch the bcc compiler turn them into IR, assembly and machine code.">
    <title>bcc · How C runs</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ecebe6' stroke-width='3'/%3E%3Crect x='14.5' y='3' width='3' height='26' fill='%23ff5a1f'/%3E%3C/svg%3E">
    <link rel="preload" href="fonts/space-mono-400-5.3.0.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Trunk builds the hydrating Leptos app, the abstract machine's Worker
         and the compiler's Worker; its post_build hook prerenders the page
         into the body. The Monaco bundle and the web fonts come from
         web/editor (npm run build). No integrity digests: every URL is
         same-origin and named after its contents, and Chrome warns that it
         ignores one on the Wasm preload. -->
    <link data-trunk rel="rust" data-bin="bcc-web" data-cargo-features="hydrate" data-wasm-opt="z" data-integrity="none">
    <link data-trunk rel="rust" data-bin="engine-worker" data-type="worker" data-cargo-features="worker" data-wasm-opt="z">
    <link data-trunk rel="rust" data-bin="compiler-worker" data-type="worker" data-cargo-features="compiler" data-wasm-opt="z">
    <link data-trunk rel="css" href="style.css">
    <link data-trunk rel="copy-dir" href="editor/dist" data-target-path="editor">
    <link data-trunk rel="copy-dir" href="editor/fonts" data-target-path="fonts">
    <link data-trunk rel="copy-file" href="_headers">
  </head>
  <body>
    <noscript><p class="notice">JavaScript and WebAssembly are required to run the Rust stepping engine and the code editor. The lessons' source is shown above, but nothing executes without them.</p></noscript>
  </body>
</html>
