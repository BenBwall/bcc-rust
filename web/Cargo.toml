[package]
name = "bcc-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
description = "Static Leptos site for the bcc C abstract machine and compiler pipeline"
license-file = "../LICENSE"
publish = false

# A standalone workspace: the site has its own lockfile and never joins the
# compiler's native build.
[workspace]

[lib]
name = "bcc_web"

# The browser app, which hydrates the prerendered page.
[[bin]]
name = "bcc-web"
path = "src/main.rs"
required-features = ["hydrate"]

# The engine Web Worker: runs the bcc abstract machine off the UI thread.
[[bin]]
name = "engine-worker"
path = "src/bin/engine_worker.rs"
required-features = ["worker"]

# The compiler Web Worker: bcc's compiler, loaded only when the page first
# compiles.
[[bin]]
name = "compiler-worker"
path = "src/bin/compiler_worker.rs"
required-features = ["compiler"]

# Native build-time renderer run by Trunk's post_build hook.
[[bin]]
name = "prerender"
path = "src/bin/prerender.rs"
required-features = ["ssr"]

[features]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook"]
ssr = ["leptos/ssr"]
worker = ["dep:bcc-rust", "bcc-rust/abstract-machine", "dep:bcc-wasm-stepper", "dep:console_error_panic_hook"]
compiler = ["dep:bcc-rust", "bcc-rust/explorer", "dep:console_error_panic_hook"]

[dependencies]
# Never the native compiler or LLVM: `worker` enables the abstract machine and
# `compiler` the pure-Rust compiler behind `bcc_rust::explorer`.
bcc-rust = { path = "..", default-features = false, optional = true }
# The WebAssembly stepper, which the engine Worker runs beside the abstract
# machine.
bcc-wasm-stepper = { path = "stepper", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
futures-channel = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
leptos = "0.8.22"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob", "console", "CssStyleDeclaration", "DedicatedWorkerGlobalScope", "Document", "DomRect", "Element", "ErrorEvent",
    "File", "FileList", "HtmlDivElement", "HtmlElement", "HtmlInputElement", "IntersectionObserver",
    "IntersectionObserverEntry", "KeyboardEvent", "MediaQueryList", "MessageEvent", "NodeList",
    "ResizeObserver", "ScrollBehavior", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Storage", "Url", "Window",
    "Worker", "WorkerOptions", "WorkerType",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
