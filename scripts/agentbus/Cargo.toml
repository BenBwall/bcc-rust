[package]
name = "agentbus"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "with-json", "sqlx-sqlite", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

