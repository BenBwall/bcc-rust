[package]
name = "bcc-rust"
version = "0.1.0"
edition = "2024"
description = "C99 Compliant C Compiler"
license-file = "LICENSE"
readme = "README.md"
keywords = ["compiler", "C", "C-compiler"]
categories = ["command-line-utilities", "development-tools", "compilers"]
repository = "https://www.github.com/bwallker/bcc-rust"
rust-version = "1.99.0"

[features]
benchmarking-internals = ["dep:coz"]
# Vectorized lexer scans through the unstable `std::simd`; requires nightly.
portable-simd = []

[profile.release]
lto = "fat"
debug = "full"
codegen-units = 1

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[lints.clippy]
# Enabled lints from the 'Restrictions' group
# Sadly we cannot used "forbid" here because it breaks clap since its macro expansions include a blanket #[allow(clippy::restriction].
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
assigning_clones = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
large_include_file = "warn"
missing_assert_message = "warn"
mod_module_files = "deny"
multiple_unsafe_ops_per_block = "deny"
# bindgen and rstest currently require incompatible syn major versions.
multiple_crate_versions = "allow"
partial_pub_fields = "warn"
pub_without_shorthand = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
same_name_method = "warn"
semicolon_inside_block = "warn"
string_lit_chars_any = "warn"
suspicious_xor_used_as_pow = "warn"
tests_outside_test_module = "warn"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_self_imports = "warn"

cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
inline_always = "allow"
perf = { level = "warn", priority = -1 }


# Enable provenance lints when strict provenance is stable
# Enable must-not-suspend and nont-exhaustive-omitted-patterns when they are stable
[lints.rust]
absolute_paths_not_starting_with_crate = "forbid"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
# fuzzy-provenance-casts = "forbid"
let_underscore_drop = "warn"
# lossy-provenance-casts = "forbid"
macro_use_extern_crate = "warn"
missing_abi = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
# must-not-suspend = "forbid"
# non-exhaustive-omitted-patterns = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "forbid"
unused_crate_dependencies = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_results = "warn"
variant_size_differences = "warn"


[dependencies]
allocator-api2 = "0.2.21"
bitflags = "2.13.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
hashbrown = { version = "0.17.1", default-features = false, features = ["allocator-api2", "inline-more"] }
owo-colors = "4.4.0"
rustc-hash = "2.1.3"
smallstr = "0.3.1"
thiserror = "2.0.21"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
pretty_assertions = "1.4.1"
proptest = "1.11.0"
rstest = "0.27.0"

[build-dependencies]
bindgen = "0.73.2"
cc = "1.5.1"
cmake = "0.1.58"

[[bench]]
name = "bench"
harness = false
required-features = ["benchmarking-internals"]

[[bench]]
name = "memory"
harness = false
required-features = ["benchmarking-internals"]

# coz relies on Unix signal APIs and does not build on Windows.
[target.'cfg(unix)'.dependencies]
coz = { version = "0.1.3", optional = true }
