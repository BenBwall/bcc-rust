[build]
# Keep target LTO flags away from host build scripts and proc macros.
target = "host-tuple"

[target.'cfg(all(target_os = "windows", target_env = "gnu"))']
rustflags = [
    "-C", "target-cpu=native",
    "-C", "linker=target/llvm/bin/ld.lld.exe",
    "-C", "linker-flavor=ld.lld",
    "-C", "linker-plugin-lto",
    "-C", "lto=fat",
    "-C", "embed-bitcode=yes",
    "-C", "target-feature=+crt-static",
    "-C", "link-self-contained=yes",
]

[target.'cfg(all(target_os = "windows", target_env = "msvc"))']
rustflags = [
    "-C", "target-cpu=native",
    "-C", "linker=target/llvm/bin/lld-link.exe",
    "-C", "linker-flavor=lld-link",
    "-C", "linker-plugin-lto",
    "-C", "lto=fat",
    "-C", "embed-bitcode=yes",
    "-C", "target-feature=+crt-static",
]

[target.'cfg(target_os = "linux")']
rustflags = [
    "-C", "target-cpu=native",
    "-C", "linker=target/llvm/bin/clang",
    "-C", "linker-plugin-lto",
    "-C", "lto=fat",
    "-C", "embed-bitcode=yes",
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-flto=full",
]
